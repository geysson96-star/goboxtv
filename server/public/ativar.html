<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ativar TV · Vidro TV</title>
<style>
  :root { --bg:#070A12; --text:#F2F5FA; --muted:#A9B4C6; --accent:#5CC8FF; --on:#04121C; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; display:flex; align-items:center; justify-content:center; padding:16px; overflow-x:hidden; }
  .blob { position:fixed; border-radius:50%; filter:blur(90px); opacity:.5; z-index:0; }
  .card { position:relative; z-index:1; width:100%; max-width:420px; padding:28px; border-radius:28px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16); backdrop-filter:blur(30px) saturate(160%); -webkit-backdrop-filter:blur(30px) saturate(160%); }
  h1 { margin:0 0 6px; font-size:26px; }
  p { margin:0 0 18px; color:var(--muted); line-height:1.5; }
  label { display:block; font-size:13px; font-weight:700; color:#C3CCDA; margin:14px 0 6px; }
  input { width:100%; height:56px; border-radius:16px; border:2px solid rgba(92,200,255,.45); background:rgba(0,0,0,.3); color:var(--text); font:700 22px ui-monospace, monospace; letter-spacing:.12em; padding:0 16px; text-transform:uppercase; }
  button { width:100%; height:56px; margin-top:20px; border:0; border-radius:28px; background:var(--accent); color:var(--on); font-weight:800; font-size:16px; cursor:pointer; }
  .msg { margin-top:14px; font-weight:700; }
  .ok { color:#86EFAC } .err { color:#FCA5A5 }
</style>
</head>
<body>
<div class="blob" style="width:360px;height:360px;background:#1D47C9;left:-80px;top:-80px"></div>
<div class="blob" style="width:320px;height:320px;background:#0E9AA8;right:-80px;bottom:-80px"></div>
<form class="card" id="f">
  <h1>Ativar a TV</h1>
  <p>Digite o código que aparece na TV e o seu código de acesso pessoal.</p>
  <label for="short">Código da TV</label>
  <input id="short" maxlength="5" autocomplete="off" required>
  <label for="code">Seu código de acesso</label>
  <input id="code" maxlength="20" placeholder="VIDRO-XXXXXX" autocomplete="off" required>
  <button type="submit">Ativar</button>
  <div class="msg" id="msg" role="status"></div>
</form>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('short').value = (q.get('p') || '').toUpperCase();
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    msg.textContent = 'Ativando…'; msg.className = 'msg';
    try {
      const r = await fetch('/api/pair/confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ short: document.getElementById('short').value, code: document.getElementById('code').value }) });
      const b = await r.json();
      if (!r.ok) throw new Error(b.error || 'Erro');
      msg.textContent = 'Pronto! A TV vai entrar em alguns segundos.'; msg.className = 'msg ok';
    } catch (err) { msg.textContent = err.message; msg.className = 'msg err'; }
  });
</script>
</body>
</html>
